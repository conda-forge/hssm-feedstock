{% set python_min = "3.11" %}
{% set name = "hssm" %}
{% set version = "0.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/hssm-{{ version }}.tar.gz
  sha256: d8ff7d4bfe91691a6666d09bc480ff7bd4c4fa786ff5eb4bb00c4e6d3d23667d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }},<3.13a0
    - numpy >=2.0.0
    - pymc >=5.26.0
    - arviz >=0.22.0
    - bambi >=0.17.2
    - onnx >=1.16.0
    - jax >=0.5.3
    - ssm-simulators >=0.12.2
    - huggingface_hub >=0.34.0
    - numpyro >=0.19.0
    - seaborn >=0.13.2
    - hddm-wfpt >=0.1.5
    - cloudpickle >=3.0.0
    - tqdm >=4.66.0
    - absl-py
    - jaxonnxruntime >=0.3.0
    - pandas >=2.2, <3
    - absl-py >=2.3.1

test:
  imports:
    - hssm
  # Temporarily not doing pip check because jaxlib version on conda-forge lags behind jax version
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://lnccbrown.github.io/HSSM/
  summary: Bayesian inference for hierarchical sequential sampling models.
  dev_url: https://github.com/lnccbrown/HSSM/
  license: LicenseRef-Brown-University-2023
  license_file: LICENSE

extra:
  recipe-maintainers:
    - digicosmos86
    - AlexanderFengler
